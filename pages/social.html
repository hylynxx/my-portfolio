  <link rel="stylesheet" href="../assets/styles/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg portfolio-navbar bg-portfolio-red shadow-sm">
      <div class="container-xxl py-3">
        <a class="navbar-brand" href="../index.html">My Portfolio</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
          aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-lg-4">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./skills.html">Skills</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="./social.html">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="py-5">
      <div class="container">
        <div class="text-center mb-5">
          <h1 class="display-5 fw-bold">
            Get In <span class="text-portfolio-orange">Touch</span>
          </h1>
          <p class="text-portfolio-muted mt-3">Let's connect and get in touch!</p>
        </div>

        <div class="row g-5 align-items-center">
          <div class="col-lg-6">
            <div class="contact-illustration d-flex align-items-center justify-content-center rounded-portfolio bg-portfolio-cream"
              aria-hidden="true">
              <div class="cartoon-scene">
                <div class="scene-circle"></div>

                <div class="notification-card">
                  <div class="notification-header">
                    <span class="notification-icon"><i class="bi bi-envelope-fill"></i></span>
                    <span class="notification-title">New email</span>
                  </div>
                  <p class="notification-text">Let's work together!</p>
                  <div class="notification-line notification-line-one"></div>
                  <div class="notification-line notification-line-two"></div>
                </div>

                <div class="cartoon-girl">
                  <div class="girl-hair-back"></div>
                  <div class="girl-body"></div>
                  <div class="girl-hood"></div>
                  <div class="girl-face"></div>
                  <div class="girl-hair-front"></div>
                  <div class="girl-eye girl-eye-left"></div>
                  <div class="girl-eye girl-eye-right"></div>
                  <div class="girl-blush girl-blush-left"></div>
                  <div class="girl-blush girl-blush-right"></div>
                  <div class="girl-smile"></div>
                  <div class="girl-drawstring girl-drawstring-left"></div>
                  <div class="girl-drawstring girl-drawstring-right"></div>
                  <div class="girl-pocket"></div>
                  <div class="girl-arm"></div>
                  <div class="girl-phone">
                    <div class="phone-screen"></div>
                  </div>
                  <div class="girl-hand"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="col-lg-6">
            <form class="contact-card rounded-portfolio bg-white p-4 p-md-5" action="./submission.html">
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="firstName" class="form-label small fw-bold">First Name</label>
                  <input type="text" class="form-control" id="firstName" name="firstName"
                    placeholder="Enter your first name" required>
                </div>
                <div class="col-md-6">
                  <label for="lastName" class="form-label small fw-bold">Last Name</label>
                  <input type="text" class="form-control" id="lastName" name="lastName"
                    placeholder="Enter your last name" required>
                </div>
                <div class="col-md-6">
                  <label for="email" class="form-label small fw-bold">Email Address</label>
                  <input type="email" class="form-control" id="email" name="email"
                    placeholder="Enter your email address" required>
                </div>
                <div class="col-md-6">
                  <label for="phone" class="form-label small fw-bold">Phone Number</label>
                  <input type="tel" class="form-control" id="phone" name="phone"
                    placeholder="Enter your phone number" required>
                </div>
                <div class="col-12">
                  <label for="message" class="form-label small fw-bold">Your Message</label>
                  <textarea class="form-control" id="message" name="message" rows="4"
                    placeholder="Write your message here..." required></textarea>
                </div>
                <div class="col-12 d-grid">
                  <button type="submit" class="btn btn-portfolio btn-lg rounded-pill">Send Message</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="portfolio-footer bg-portfolio-burgundy text-white py-4">
    <div class="container-xxl">
      <div class="d-flex flex-column flex-md-row align-items-center justify-content-between gap-3">

          <li class="nav-item"><a class="nav-link p-0" href="./skills.html">Skills</a></li>
          <li class="nav-item"><a class="nav-link p-0" href="./social.html">Contact</a></li>
        </ul>
        <div class="d-flex gap-2">
          <a class="social-icon" href="https://www.facebook.com/mary.mae.malinao.832428" aria-label="Facebook"
            target="_blank" rel="noopener noreferrer"><i class="bi bi-facebook" aria-hidden="true"></i></a>
          <a class="social-icon" href="https://www.instagram.com/mary_mae999?psln=anNnazE2d3Rhd2Ex"
            aria-label="Instagram" target="_blank" rel="noopener noreferrer"><i class="bi bi-instagram"
              aria-hidden="true"></i></a>
          <a class="social-icon" href="https://www.tiktok.com/@your___mae" aria-label="TikTok" target="_blank"
            rel="noopener noreferrer"><i class="bi bi-tiktok" aria-hidden="true"></i></a>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
